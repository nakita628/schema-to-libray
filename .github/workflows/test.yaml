name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - run: vp install

      - run: vp check

      - run: vp run schema-to-library#build

      # Type-check every generated fixture against the real target library, so a
      # generator emitting an API the library does not have fails the build.
      - run: vp run -r typecheck

      - run: vp test --coverage
